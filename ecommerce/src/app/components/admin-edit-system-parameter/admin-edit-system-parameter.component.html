<div class="main-content">

    <div class="section-content section-content-p30">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h3>Edit System Parameter</h3>
            </div>

            <form [formGroup]="systemParameterFormGroup" (ngSubmit)="editSystemParameter()">
                <div class="row">
                    <div class="col-md-2"> <label>Code</label></div>
                    <div class="col-md-9">
                        <div class="input-space">
                            <input type="text" formControlName="code" style="width: 40%;" maxlength="64">
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-2"> <label>Value</label></div>
                    <div class="col-md-9">
                        <div class="input-space">
                            <input type="text" formControlName="value" placeholder="Enter value" 
                                   style="width: 40%;" maxlength="128">

                            <div *ngIf="value?.invalid && (value?.dirty || value?.touched)" 
                                 class="alert alert-danger mt-1" style="width: 40%;">
   
                                 <div *ngIf="value?.errors?.['required'] || value?.errors?.['notOnlyWhitespace']">
                                    Value is required
                                </div>
   
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-2"> <label>Description</label></div>
                    <div class="col-md-9">
                        <div class="input-space">
                            <input type="text" formControlName="description" placeholder="Enter description" 
                                   style="width: 40%;" maxlength="256">

                            <div *ngIf="description?.invalid && (description?.dirty || description?.touched)" 
                                 class="alert alert-danger mt-1" style="width: 40%;">
   
                                 <div *ngIf="description?.errors?.['required'] || description?.errors?.['notOnlyWhitespace']">
                                    Description is required
                                </div>
   
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="button" class="btn btn-danger me-2" routerLink="/admin/system-parameters">Cancel</button>
                    <button type="submit" class="btn btn-warning" [disabled]="isDisabled">Edit</button>
                </div>
              </form>
        </div>
    </div>
    
</div>
