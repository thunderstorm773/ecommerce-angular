<div class="detail-section" *ngIf="product">
    <div class="container-fluid">

        <img src="{{ product.imageUrl }}" class="detail-img" >

        <h3>{{ product.name }}</h3>
        <div class="price">{{ currencyService.formatPriceString(product.unitPrice, product.unitPriceEur) }}</div>

        <div class="availability">
            <span [ngClass]="product.unitsInStock > 0 ? 'text-success' : 'text-danger'">
                {{ product.unitsInStock > 0 ? 'In stock' : 'Not in stock' }}
            </span>
        </div>

        <button (click)="addToCart()" class="btn btn-primary btn-sm" 
                [disabled]="product.unitsInStock < 1">Buy</button>

        <button *oktaHasAnyGroup="['Admin']" class="btn btn-warning btn-sm ms-2" 
                [routerLink]="['/admin/products/edit', product.id]">Edit</button>        

        <br/>
        <br/>

        <h4>Description</h4>
        <p class="product-description">{{ product.description }}</p>

        <app-product-comment></app-product-comment>

        <a routerLink="/products" class="primary-btn mt-5">Back</a>
    </div>
</div>


<div class="main-content" *ngIf="!product">
    <div class="section-content section-content-p30">
        <div class="container-fluid">
            <!-- If product empty then display a message -->
            <div class="alert alert-warning col-md-12" role="alert">
                No product found.
            </div>
        </div>
    </div>
</div>
