<div class="main-content">

    <div class="section-content section-content-p30">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h3>Edit Category</h3>
            </div>

            <form [formGroup]="categoryFormGroup" (ngSubmit)="editCategory()">
                <div class="row">
                    <div class="col-md-2"> <label>Category name</label></div>
                    <div class="col-md-9">
                        <div class="input-space">
                            <input type="text" formControlName="categoryName" placeholder="Enter category name" 
                                   style="width: 30%;" maxlength="20">

                            <div *ngIf="categoryName?.invalid && (categoryName?.dirty || categoryName?.touched)" 
                                 class="alert alert-danger mt-1" style="width: 30%;">
   
                                 <div *ngIf="categoryName?.errors?.['required'] || categoryName?.errors?.['notOnlyWhitespace']">
                                    Category name is required
                                </div>
            
                                <div *ngIf="categoryName?.errors?.['minlength']">
                                    Category name must be at least 2 characters long
                                </div>
            
                                <div *ngIf="categoryName?.errors?.['categoryNameExists']">
                                    Category name already exists
                                </div>
   
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-3">
                    <button type="button" class="btn btn-danger me-2" routerLink="/admin/categories">Cancel</button>
                    <button type="submit" class="btn btn-warning" [disabled]="isDisabled">Edit</button>
                </div>
              </form>
        </div>
    </div>
    
</div>
