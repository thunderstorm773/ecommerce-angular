<div class="product-comment" *ngIf="isAuthenticated">
    <form>
        <div class="form-group">
            <textarea class="form-control" rows="4" required 
                      placeholder="Write your comment here..."></textarea>
        </div>
        <button type="submit" class="btn btn-info btn-sm mt-3">Comment</button>
    </form>
</div>
