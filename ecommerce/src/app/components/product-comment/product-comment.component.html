<div class="product-comment" *ngIf="isAuthenticated">
    <form [formGroup]="commentFormGroup" (ngSubmit)="postComment()">
        <div class="form-group">
            <textarea class="form-control" rows="4" formControlName="comment" required 
                      placeholder="Write your comment here..."></textarea>

            <div *ngIf="comment?.invalid && (comment?.dirty || comment?.touched)" 
                        class="alert alert-danger mt-1">

                <div *ngIf="comment?.errors?.['required'] || comment?.errors?.['notOnlyWhitespace']">
                     Comment is required
                </div>
 
                <div *ngIf="comment?.errors?.['minlength']">
                     Comment must be at least 20 characters long
                </div>
            </div>          
        </div>
        <button type="submit" [disabled]="isDisabled" class="btn btn-info btn-sm mt-3">Comment</button>
    </form>
    <br/>
</div>

<div *ngIf="productComments.length > 0">
    <br/>
    <h4>Comments</h4>
    <hr>
    <div *ngFor="let comment of productComments" >
        <div class="d-flex justify-content-between align-items-center">
            <div>
            <div class="d-flex align-items-center">
                <i class="fas fa-user me-2"></i>
                <span>{{ comment.userFullname }}</span>
            </div>

            <div class="d-flex align-items-center">
                <i class="fas fa-clock me-2"></i>
                <span>{{ comment.dateCreated | date: 'dd.MM.YYYY HH:mm' }}</span>
            </div>
            </div>
            <div class="d-flex flex-column align-items-center">
                <p class="mb-0">{{ comment.content }}</p>
            </div>
            <div class="d-flex justify-content-end mt-2">
                <div *ngIf="canUserManageComment(comment.username)">
                    <button class="btn btn-sm btn-danger" (click)="open(deleteMdl, comment.id)">Delete</button>
                </div>
            </div>
        </div>
        <hr>
    </div>

</div>

<div class="footer-pagination" *ngIf="productComments.length > 0">
    <div class="row">
        <div class="col-md-6"></div>

        <div class="col-md-6">
            <div class="row">
                <div class="col-md-9" style="padding-left: 30%">

                    <ngb-pagination [(page)]="currentPageNumber"
                                    [pageSize]="pageSize"
                                    [collectionSize]="totalElements"
                                    [maxSize]="5"
                                    [boundaryLinks]="true"
                                    (pageChange)="listProductCommentsByProduct()">
                    </ngb-pagination>
                </div>

                <div class="col-md-3 mt-2" style="text-align: right;">

                    <select #pageSizeSelect (change)="updatePageSize(pageSizeSelect.value)">
                        <option>5</option>
                        <option>10</option>
                        <option selected="true">20</option>
                        <option>50</option>
                    </select>
                </div>

            </div>
            
        </div>
    </div>
</div>

<ng-template #deleteMdl let-modal>
	<div class="modal-header">
		<h4 class="modal-title" id="modal-basic-title">Delete Comment</h4>
		<button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
	</div>
	<div class="modal-body">
		<form>
			<div class="mb-3">
				<p>Do you really want to delete this comment?</p>
			</div>
		</form>
	</div>
	<div class="modal-footer">
		<button type="button" class="btn btn-danger" (click)="deleteComment(selectedCommentId)">Delete</button>
	</div>
</ng-template>
