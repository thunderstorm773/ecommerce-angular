<div class="main-content">
    <div class="section-content section-content-p30">
        <div class="container-fluid">
            <h3>Your Orders</h3>

            <div *ngIf="orderHistoryList.length > 0">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th scope="col" width="20%">Order Tracking Number</th>
                            <th scope="col" width="10%">Total Price</th>
                            <th scope="col" width="10%">Total Quantity</th>
                            <th scope="col" width="10%">Date</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr *ngFor="let orderHistory of orderHistoryList">
                            <td>{{ orderHistory.orderTrackingNumber }}</td>
                            <td>{{ orderHistory.totalPrice | currency: 'USD' }}</td>
                            <td>{{ orderHistory.totalQuantity }}</td>
                            <td>{{ orderHistory.dateCreated | date: 'dd.MM.YYYY HH:mm:ss' }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div *ngIf="orderHistoryList.length == 0" class="alert alert-warning col-md-12" role="alert">
                <p>No orders found.</p>
            </div>

            <!-- begin footer -->
            <div class="footer-pagination" *ngIf="orderHistoryList.length > 0">
                <div class="row">
                    <div class="col-md-6"></div>

                    <div class="col-md-6">
                        <div class="row">
                            <div class="col-md-9" style="padding-left: 30%">

                                <ngb-pagination [(page)]="currentPageNumber"
                                                [pageSize]="pageSize"
                                                [collectionSize]="totalElements"
                                                [maxSize]="5"
                                                [boundaryLinks]="true"
                                                (pageChange)="listOrderHistory()">
                                </ngb-pagination>
                            </div>

                            <div class="col-md-3 mt-2" style="text-align: right;">
                                <span class="mr-2">Page Size</span>

                                <select #pageSizeSelect (change)="updatePageSize(pageSizeSelect.value)">
                                    <option>5</option>
                                    <option>10</option>
                                    <option selected="true">20</option>
                                    <option>50</option>
                                </select>
                            </div>

                        </div>
                        
                    </div>
                </div>
            </div>
            <!-- end footer --> 
            
        </div>
    </div>
</div>
