<div class="main-content">

    <div *ngIf="productCategories.length > 0" class="section-content section-content-p30">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center">
                <h3>Product Categories</h3>
                <button class="btn btn-primary" routerLink="/admin/categories/add">Add Category</button>
            </div>

                <table class="table table-hover mt-2">
                    <thead>
                        <tr>
                            <th scope="col" width="20%">Category Name</th>
                            <th scope="col" width="20%">Last Updated</th>
                            <th scope="col" width="10%">Status</th>
                            <th scope="col" width="10%">Actions</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr *ngFor="let productCategory of productCategories">
                            <td>{{ productCategory.categoryName }}</td>
                            <td>{{ productCategory.lastUpdated | date: 'dd.MM.YYYY HH:mm:ss' }}</td>
                            <td>{{ productCategory.isActive ? 'Active' : 'Inactive' }}</td>
                            <td>
                                <button class="btn btn-warning me-2" 
                                        [routerLink]="['/admin/categories/edit', productCategory.id]">Edit</button>
                                <button class="btn btn-danger" [routerLink]="['/delete', productCategory.id]">Delete</button>
                            </td>
                        </tr>
                    </tbody>
                </table>

            <!-- begin footer -->
            <div class="footer-pagination" *ngIf="productCategories.length > 0">
                <div class="row">
                    <div class="col-md-6"></div>

                    <div class="col-md-6">
                        <div class="row">
                            <div class="col-md-9" style="padding-left: 30%">

                                <ngb-pagination [(page)]="currentPageNumber"
                                                [pageSize]="pageSize"
                                                [collectionSize]="totalElements"
                                                [maxSize]="5"
                                                [boundaryLinks]="true"
                                                (pageChange)="listProductCategories()">
                                </ngb-pagination>
                            </div>

                            <div class="col-md-3 mt-2" style="text-align: right;">
                                <span class="mr-2">Page Size</span>

                                <select #pageSizeSelect (change)="updatePageSize(pageSizeSelect.value)">
                                    <option>5</option>
                                    <option>10</option>
                                    <option selected="true">20</option>
                                    <option>50</option>
                                </select>
                            </div>

                        </div>
                        
                    </div>
                </div>
            </div>
            <!-- end footer --> 

        </div>
    </div>

</div>
